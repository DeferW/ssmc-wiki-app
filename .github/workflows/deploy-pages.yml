name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download generated data
        uses: actions/checkout@v4
        with:
          repository: DeferW/ssmc-wiki-data
          ref: main
          path: .generated-data
          sparse-checkout: data
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          persist-credentials: false

      - name: Replace published data
        shell: bash
        run: |
          rm -rf public/data
          mkdir -p public/data
          cp -a .generated-data/data/. public/data/
          test -f public/data/catalog/catalog.json
          test -f public/data/chemistry/catalog.json
          test -f public/data/maps/catalog.json
          test -f public/data/mobs/catalog.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply app data overrides
        run: npm run data:overrides
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
