name: PR checks

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download generated data
        uses: actions/checkout@v4
        with:
          repository: DeferW/ssmc-wiki-data
          ref: main
          path: .generated-data
          sparse-checkout: data
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Type-check and build
        run: npm run build
        env:
          SSMC_DATA_SOURCE: .generated-data/data
